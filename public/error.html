<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sonara - Offline Player</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0B0A0A;
      color: #F4EFEA;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top, 24px) 16px env(safe-area-inset-bottom, 24px) 16px;
      user-select: none;
      -webkit-user-select: none;
    }
    header {
      padding: 16px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      margin-bottom: 16px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand svg {
      width: 28px;
      height: 28px;
      color: #FF5B2E;
    }
    .brand h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 9999px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 600;
      color: #52B58A;
    }
    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #52B58A;
    }
    .status-banner {
      background: rgba(255, 91, 46, 0.08);
      border: 1px solid rgba(255, 91, 46, 0.2);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 13px;
      color: rgba(255,255,255,0.8);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .track-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-bottom: 90px;
    }
    .track-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .track-row:active {
      background: rgba(255,255,255,0.08);
    }
    .track-row.active {
      background: rgba(255, 91, 46, 0.12);
      border-color: rgba(255, 91, 46, 0.35);
    }
    .track-info {
      flex: 1;
      overflow: hidden;
      padding-right: 12px;
    }
    .track-title {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }
    .track-artist {
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      cursor: pointer;
      flex-shrink: 0;
    }
    .track-row.active .track-btn {
      background: #FF5B2E;
      color: #fff;
    }
    /* Empty State */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 16px;
    }
    .empty-state svg {
      width: 48px;
      height: 48px;
      color: rgba(255,255,255,0.3);
      margin-bottom: 16px;
    }
    .empty-state h2 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #fff;
    }
    .empty-state p {
      font-size: 13px;
      color: rgba(255,255,255,0.5);
      max-width: 300px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn-retry {
      background: #FFFFFF;
      color: #000000;
      border: none;
      padding: 12px 28px;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
    /* Bottom Player Bar */
    .player-bar {
      position: fixed;
      bottom: env(safe-area-inset-bottom, 16px);
      left: 16px;
      right: 16px;
      background: #171615;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 16px;
      padding: 12px 16px;
      display: none;
      box-shadow: 0 12px 32px rgba(0,0,0,0.8);
      backdrop-filter: blur(20px);
    }
    .player-bar.visible {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .now-playing {
      flex: 1;
      overflow: hidden;
    }
    .np-title {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .np-artist {
      font-size: 11px;
      color: rgba(255,255,255,0.5);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .ctl-btn {
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
    }
    .ctl-play {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #FFFFFF;
      color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/>
      </svg>
      <h1>Sonara</h1>
    </div>
    <div class="badge">
      <div class="badge-dot"></div>
      <span>Offline</span>
    </div>
  </header>

  <div id="content"></div>

  <div id="playerBar" class="player-bar">
    <div class="now-playing">
      <div id="npTitle" class="np-title">Track Title</div>
      <div id="npArtist" class="np-artist">Artist Name</div>
    </div>
    <div class="controls">
      <button id="prevBtn" class="ctl-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
      </button>
      <button id="playBtn" class="ctl-play">
        <svg id="playIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        <svg id="pauseIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
      </button>
      <button id="nextBtn" class="ctl-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
      </button>
    </div>
  </div>

  <audio id="audioElem"></audio>

  <script>
    const CACHE_NAME = "sonara-offline-audio-v1";
    const METADATA_KEY = "sonara_offline_metadata_v1";

    let tracks = [];
    let currentIndex = -1;
    const audio = document.getElementById("audioElem");
    const playerBar = document.getElementById("playerBar");
    const playIcon = document.getElementById("playIcon");
    const pauseIcon = document.getElementById("pauseIcon");
    const playBtn = document.getElementById("playBtn");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const npTitle = document.getElementById("npTitle");
    const npArtist = document.getElementById("npArtist");
    const content = document.getElementById("content");

    // Auto-reload to main app the instant network connectivity is restored
    window.addEventListener("online", () => {
      window.location.href = "/";
    });

    setInterval(() => {
      if (navigator.onLine) {
        fetch(window.location.origin, { method: "HEAD", mode: "no-cors" })
          .then(() => { window.location.href = "/"; })
          .catch(() => {});
      }
    }, 4000);

    function loadDownloadedTracks() {
      try {
        const raw = localStorage.getItem(METADATA_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        return [];
      }
    }

    async function playTrack(index) {
      if (index < 0 || index >= tracks.length) return;
      currentIndex = index;
      const track = tracks[index];

      npTitle.textContent = track.title || "Unknown Title";
      npArtist.textContent = track.artist || "Unknown Artist";
      playerBar.classList.add("visible");

      // Update rows styling
      document.querySelectorAll(".track-row").forEach((el, i) => {
        if (i === index) el.classList.add("active");
        else el.classList.remove("active");
      });

      try {
        const cache = await caches.open(CACHE_NAME);
        const match = await cache.match("/offline/audio/" + encodeURIComponent(track.id));
        if (match) {
          const blob = await match.blob();
          const url = URL.createObjectURL(blob);
          audio.src = url;
          audio.play().catch(() => {});
          playIcon.style.display = "none";
          pauseIcon.style.display = "block";
        } else {
          alert("Audio stream not found in offline storage for this track.");
        }
      } catch (err) {
        console.error("Failed to load cached audio:", err);
      }
    }

    function togglePlay() {
      if (!audio.src) {
        if (tracks.length > 0) playTrack(0);
        return;
      }
      if (audio.paused) {
        audio.play().catch(() => {});
        playIcon.style.display = "none";
        pauseIcon.style.display = "block";
      } else {
        audio.pause();
        playIcon.style.display = "block";
        pauseIcon.style.display = "none";
      }
    }

    playBtn.addEventListener("click", togglePlay);
    prevBtn.addEventListener("click", () => {
      if (tracks.length === 0) return;
      const prev = (currentIndex - 1 + tracks.length) % tracks.length;
      playTrack(prev);
    });
    nextBtn.addEventListener("click", () => {
      if (tracks.length === 0) return;
      const next = (currentIndex + 1) % tracks.length;
      playTrack(next);
    });
    audio.addEventListener("ended", () => {
      if (tracks.length === 0) return;
      const next = (currentIndex + 1) % tracks.length;
      playTrack(next);
    });

    function renderUI() {
      tracks = loadDownloadedTracks();
      if (!tracks || tracks.length === 0) {
        content.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/>
            </svg>
            <h2>No Internet Connection</h2>
            <p>You have no downloaded songs saved for offline playback. Connect to Wi-Fi or mobile data to stream music.</p>
            <button class="btn-retry" onclick="window.location.reload()">Retry Connection</button>
          </div>
        `;
        return;
      }

      let html = `
        <div class="status-banner">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FF5B2E" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span>Offline Mode · ${tracks.length} downloaded tracks available</span>
        </div>
        <div class="track-list">
      `;

      tracks.forEach((t, i) => {
        html += `
          <div class="track-row" onclick="playTrack(${i})">
            <div class="track-info">
              <div class="track-title">${t.title || 'Unknown Title'}</div>
              <div class="track-artist">${t.artist || 'Unknown Artist'}</div>
            </div>
            <div class="track-btn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            </div>
          </div>
        `;
      });

      html += `</div>`;
      content.innerHTML = html;
    }

    renderUI();
  </script>
</body>
</html>
