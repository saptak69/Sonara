name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build React App
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Create offline fallback UI
        run: |
          mkdir -p dist
          cat << 'EOF' > dist/error.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
            <title>Sonara - Offline</title>
            <style>
              body {
                margin: 0; padding: 0; background-color: #070302; color: #fff;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;
                text-align: center;
              }
              .container { padding: 2rem; max-width: 400px; }
              h1 { font-size: 24px; margin-bottom: 12px; font-weight: 600; }
              p { color: #a1a1aa; font-size: 15px; margin-bottom: 32px; line-height: 1.5; }
              button {
                background: white; color: black; border: none; padding: 14px 32px;
                border-radius: 9999px; font-weight: 600; font-size: 16px;
                cursor: pointer; transition: opacity 0.2s;
              }
              button:active { opacity: 0.7; }
              svg { margin-bottom: 24px; color: #52525b; width: 64px; height: 64px; }
            </style>
          </head>
          <body>
            <div class="container">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 2 20 20"/><path d="M8.5 16.5a7.1 7.1 0 0 1-4.7-2.3"/><path d="M19 19a7.1 7.1 0 0 1-5.5-2.5"/><path d="M12 20.5v.01"/><path d="M4 12a10.9 10.9 0 0 1 2.5-4"/><path d="M20 12a10.9 10.9 0 0 1-5-6.5"/></svg>
              <h1>You're Offline</h1>
              <p>Sonara needs an internet connection to stream music. Please check your network and try again.</p>
              <button onclick="window.location.reload()">Try Again</button>
            </div>
          </body>
          </html>
          EOF
          # Create index.html too so Capacitor doesn't complain if errorPath is missed
          cp dist/error.html dist/index.html

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Inject Google Services JSON
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo $GOOGLE_SERVICES_JSON_BASE64 | base64 -d > android/app/google-services.json

      - name: Set Execute Permissions for gradlew
        run: chmod +x android/gradlew

      - name: Build APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sonara-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
